<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#ff00aa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow around tip (top-left hotspot at 3,3) -->
  <circle cx="7" cy="7" r="7" fill="url(#starGlow)"/>
  <!-- Wand shaft -->
  <line x1="7" y1="7" x2="28" y2="28" stroke="#4a0e4e" stroke-width="5" stroke-linecap="round"/>
  <line x1="7" y1="7" x2="28" y2="28" stroke="#ff66cc" stroke-width="3" stroke-linecap="round"/>
  <line x1="11" y1="11" x2="26" y2="26" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- Star tip -->
  <polygon points="7,1 9,5 13,5 10,8 11,12 7,9.5 3,12 4,8 1,5 5,5" fill="#ffd700" stroke="#ff007f" stroke-width="1"/>
  <circle cx="7" cy="6.5" r="2" fill="#00ffcc"/>
  <!-- Mini sparkles -->
  <circle cx="15" cy="5" r="1.5" fill="#00ffcc"/>
  <circle cx="5" cy="16" r="1.5" fill="#ff66cc"/>
  <circle cx="18" cy="12" r="1" fill="#ffffff"/>
</svg>
